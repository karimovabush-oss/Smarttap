<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business — SMART TAP</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f7f7f8;font:16px/1.5 Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,430px);background:#191b21;border:1px solid #30323a;border-radius:24px;padding:28px;text-align:center}.logo{width:90px;height:90px;object-fit:cover;border-radius:22px}.desc,.tag{color:#a5a7b0}.links{display:grid;gap:10px;margin-top:24px}.links a{padding:13px;border-radius:11px;background:#282b32;color:white;text-decoration:none}.powered{margin-top:24px;color:#8a8d98;font-size:12px;letter-spacing:2px}</style></head><body><main class="card" id="card">Загрузка…</main><script>
(async()=>{const slug=location.pathname.split('/').filter(Boolean).pop(),root=document.getElementById('card');try{const r=await fetch('/api/public/'+encodeURIComponent(slug),{cache:'no-store'});if(!r.ok)throw Error();const c=await r.json();document.title=c.business_name+' — SMART TAP';const mapUrl=safeUrl(c.address);const links=[['Позвонить',c.phone?'tel:'+c.phone:''],['WhatsApp',safeUrl(c.whatsapp)],['Instagram',safeUrl(c.instagram)],['Telegram',safeUrl(c.telegram)],['Сайт',safeUrl(c.website)],['Открыть карту',mapUrl]].filter(x=>x[1]);root.innerHTML=(c.logo_url?'<img class="logo" src="'+esc(c.logo_url)+'">':'<div class="logo" style="display:inline-grid;place-items:center;font-size:34px">✦</div>')+'<h1>'+esc(c.business_name)+'</h1><div class="tag">'+esc(c.tagline||'')+'</div><p class="desc">'+esc(c.description||'')+'</p><nav class="links">'+links.map(x=>'<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[0])+'</a>').join('')+'</nav><div class="powered">SMART TAP · YOUR BUSINESS. ONE TAP.</div>';}catch(e){root.textContent='Страница не найдена';}})();function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>

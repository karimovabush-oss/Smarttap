<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART TAP Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f7f7f8;font:15px Arial}.wrap{max-width:900px;margin:35px auto;padding:20px}.brand{font-size:22px;font-weight:900;letter-spacing:2px}.brand span{color:#c7ff5e}.panel{background:#191b21;border:1px solid #30323a;border-radius:15px;padding:20px;margin:18px 0}input,textarea{width:100%;padding:12px;margin:5px 0 14px;border:1px solid #343741;border-radius:9px;background:#111318;color:white}label{display:block;color:#b9bac2;font-size:13px}button{background:#c7ff5e;color:#111;border:0;padding:12px 18px;border-radius:9px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#a5a7b0}.client{padding:12px;border-bottom:1px solid #333}a{color:#c7ff5e}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">SMART<span>TAP</span></div><h1>Панель администратора</h1><p class="muted">Управление цифровыми страницами клиентов.</p><section class="panel"><label>Ключ администратора</label><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="loadClients()">Войти / обновить</button><p id="msg" class="muted"></p></section><section class="panel"><h2 id="formTitle">Добавить клиента</h2><input type="hidden" id="originalSlug" value=""><form id="form"><div class="grid"><div><label>Название бизнеса *</label><input name="business_name" required></div><div><label>Адрес страницы (slug)</label><input name="slug" placeholder="florashop"></div><div><label>Телефон</label><input name="phone"></div><div><label>WhatsApp URL</label><input name="whatsapp"></div><div><label>Instagram URL</label><input name="instagram"></div><div><label>Telegram URL</label><input name="telegram"></div><div><label>Ссылка на карту (Google Maps / Yandex Maps / 2GIS)</label><input name="address" type="url" placeholder="https://maps.app.goo.gl/..."></div><div><label>Сайт</label><input name="website"></div><div><label>Логотип URL</label><input name="logo_url"></div><div><label>Цвет акцента</label><input name="accent_color" value="#c7ff5e"></div></div><label>Описание</label><textarea name="description" rows="3"></textarea><button type="submit" id="saveBtn">Сохранить клиента</button> <button type="button" onclick="resetForm()" style="background:#444;color:#fff">Отмена</button></form></section><section class="panel"><h2>Клиенты</h2><div id="clients" class="muted">Войди, чтобы загрузить список.</div></section></main><script>
const key=()=>document.getElementById('key').value,msg=t=>document.getElementById('msg').textContent=t;
let cachedClients=[];async function loadClients(){try{const r=await fetch('/api/clients',{headers:{'x-admin-key':key()}}),d=await r.json();if(!r.ok)throw Error(d.error);cachedClients=d;document.getElementById('clients').innerHTML=d.map(c=>'<div class="client"><b>'+esc(c.business_name)+'</b> — <a target="_blank" href="/t/'+encodeURIComponent(c.slug)+'">/t/'+esc(c.slug)+'</a> · <a target="_blank" href="/api/clients/'+encodeURIComponent(c.slug)+'/qr">QR</a> · <button type="button" onclick="editClient(\''+esc(c.slug)+'\')">Изменить</button> · <button type="button" style="background:#733;color:white" onclick="deleteClient(\''+esc(c.slug)+'\')">Удалить</button></div>').join('')||'Пока клиентов нет';msg('Клиентов: '+d.length);}catch(e){msg(e.message)}}
function editClient(slug){const c=cachedClients.find(x=>x.slug===slug);if(!c)return;const f=document.getElementById('form');for(const el of f.elements){if(el.name&&c[el.name]!==undefined)el.value=c[el.name]||'';}document.getElementById('originalSlug').value=slug;document.getElementById('formTitle').textContent='Изменить клиента: '+c.business_name;document.getElementById('saveBtn').textContent='Сохранить изменения';window.scrollTo({top:0,behavior:'smooth'});}
function resetForm(){document.getElementById('form').reset();document.getElementById('originalSlug').value='';document.getElementById('formTitle').textContent='Добавить клиента';document.getElementById('saveBtn').textContent='Сохранить клиента';}
async function deleteClient(slug){const c=cachedClients.find(x=>x.slug===slug);if(!confirm('Удалить клиента '+(c?.business_name||slug)+'? Это действие нельзя отменить.'))return;try{const r=await fetch('/api/clients/'+encodeURIComponent(slug),{method:'DELETE',headers:{'x-admin-key':key()}}),d=await r.json();if(!r.ok)throw Error(d.error);msg('Клиент удалён');resetForm();loadClients();}catch(e){msg(e.message)}}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const old=document.getElementById('originalSlug').value;if(old&&old!==data.slug){msg('Чтобы изменить адрес страницы, сначала создай новый адрес отдельно.');return;}const r=await fetch('/api/clients',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key()},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.error);msg('Сохранено: /t/'+d.slug);resetForm();loadClients();}catch(x){msg(x.message)}});
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
